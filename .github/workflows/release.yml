name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 手动发布时使用的 tag
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # 打 tag 之前如果没跑过 CI，这里补一道。宁可多花两分钟，
  # 也不要发出一个隐私扫描没过的包。
  guard:
    name: 发布前闸门
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/privacy-scan.sh
      - name: 安装 rust-toolchain.toml 钉住的工具链
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  linux:
    name: Linux 包（deb / rpm）
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 rust-toolchain.toml 钉住的工具链
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm

      - name: 校验 tag 与 Cargo.toml 版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "$tag" = "$crate" ] || {
            echo "::error::tag v$tag 与 Cargo.toml 的 $crate 对不上，先改版本号再打 tag"
            exit 1
          }

      - run: cargo build --release --bin interview-studio
      - run: cargo deb -p is-app --no-build
      - run: cargo generate-rpm -p crates/is-app

      - name: 收拢产物
        run: |
          mkdir -p dist
          cp target/debian/*.deb dist/
          cp target/generate-rpm/*.rpm dist/
          tar -C target/release -czf "dist/interview-studio-${GITHUB_REF_NAME}-x86_64-linux.tar.gz" interview-studio
          (cd dist && sha256sum * > SHA256SUMS)
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/

      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          # 直接发布。把关放在 guard job（隐私扫描 + 测试）和「打 tag」这个
          # 动作本身上——tag 是有意为之的，不需要再加一道人工点击。
          draft: false

  # Windows 后端还没实现。等 is-audio 有了 WASAPI 实现，
  # 把下面这个 job 打开即可，流水线其余部分不用动。
