name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 手动发布时使用的 tag
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # 打 tag 之前如果没跑过 CI，这里补一道。宁可多花两分钟，
  # 也不要发出一个隐私扫描没过的包。
  guard:
    name: 发布前闸门
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/privacy-scan.sh
      - name: 安装 rust-toolchain.toml 钉住的工具链
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: 装 ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: cargo test --workspace

      # 版本号只在这里校验一次，两个打包 job 都用它的输出，
      # 免得各自 grep 一遍还可能对不齐。
      - name: 校验 tag 与 Cargo.toml 版本一致
        id: version
        run: |
          crate=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            [ "$tag" = "$crate" ] || {
              echo "::error::tag v$tag 与 Cargo.toml 的 $crate 对不上，先改版本号再打 tag"
              exit 1
            }
          fi
          echo "version=$crate" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux 包（deb / rpm / tar.gz）
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 rust-toolchain.toml 钉住的工具链
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm

      - run: cargo build --release --bin interview-studio
      - run: cargo deb -p is-app --no-build
      - run: cargo generate-rpm -p crates/is-app

      - name: 收拢产物
        run: |
          mkdir -p dist
          cp target/debian/*.deb dist/
          cp target/generate-rpm/*.rpm dist/
          tar -C target/release -czf \
            "dist/interview-studio-v${{ needs.guard.outputs.version }}-x86_64-linux.tar.gz" \
            interview-studio
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/

  windows:
    name: Windows 包（zip / msi）
    needs: guard
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 rust-toolchain.toml 钉住的工具链
        run: rustup show
      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release --bin interview-studio

      - name: 准备 WiX v3
        shell: pwsh
        run: ./scripts/find-wix.ps1

      - name: 打包
        shell: pwsh
        run: ./scripts/windows-package.ps1 -Version "${{ needs.guard.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: dist/

  # 校验和必须由一个 job 统一算：两个平台各传一份 SHA256SUMS 会互相覆盖，
  # 用户下载到的那份只覆盖了其中一半的文件。
  publish:
    name: 发布
    needs: [guard, linux, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      # checkout 要在下载产物之前：它默认会清空工作区，放在后面会把刚下下来的
      # 产物一起删掉。这里只需要仓库里的 release-notes.md。
      - uses: actions/checkout@v4
        with:
          sparse-checkout: packaging/release-notes.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          path: staged

      - name: 汇总并算校验和
        run: |
          mkdir -p dist
          find staged -type f -exec cp {} dist/ \;
          (cd dist && sha256sum * > SHA256SUMS)
          ls -lh dist
          cat dist/SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body_path: packaging/release-notes.md
          # 直接发布。把关放在 guard job（隐私扫描 + 测试）和「打 tag」这个
          # 动作本身上——tag 是有意为之的，不需要再加一道人工点击。
          draft: false
