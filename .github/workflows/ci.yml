name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # 隐私闸门单独成 job：它不依赖工具链，失败要能一眼看出是「泄露」而不是「编译错」
  privacy:
    name: 隐私扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/privacy-scan.sh

  check:
    name: 格式 / lint / 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 rust-toolchain.toml 钉住的工具链
        run: rustup show
      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets

      # 混音/探测的测试要有 ffmpeg 才跑得起来。runner 镜像不保证带，显式装上——
      # 缺了的话 need_ffmpeg! 会在 CI 下直接失败，不会悄悄跳过变成绿灯。
      - name: 装 ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # CI 容器里没有 PipeWire，依赖真实音频设备的测试会自行跳过
      # （见 is-audio 里的 require! 宏），纯逻辑测试照常跑。
      # --nocapture：跳过和通过在默认输出里长得一样，让「跳过」在日志里现形。
      - name: 测试
        run: cargo test --workspace -- --nocapture

  # 交叉编译只能证明 Windows 代码编得过。known folder、GetDiskFreeSpaceExW、
  # 字体查找这些只有在 Windows 上真跑一遍才算验证。
  windows:
    name: Windows 检查 / 测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 rust-toolchain.toml 钉住的工具链
        run: rustup show
      - uses: Swatinem/rust-cache@v2

      - name: 装 ffmpeg
        run: choco install ffmpeg -y --no-progress

      - name: clippy
        run: cargo clippy --workspace --all-targets

      # runner 没有声卡，设备相关的测试会跳过；纯逻辑与平台 API（磁盘余量、
      # known folder、字体、WASAPI 枚举器）照常跑。--nocapture 见上。
      - name: 测试
        run: cargo test --workspace -- --nocapture

  # main.wxs 里的文件清单是 heat 采集的，但产品结构、快捷方式、升级码这些
  # 是手写的，写错了要在打 tag 之前就知道，不是发布当天才发现。
  windows-package:
    name: Windows 打包冒烟
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 rust-toolchain.toml 钉住的工具链
        run: rustup show
      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release --bin interview-studio

      - name: 准备 WiX v3
        shell: pwsh
        run: ./scripts/find-wix.ps1

      - name: 打包
        shell: pwsh
        run: ./scripts/windows-package.ps1 -Version "0.0.0"

      # 装进去的必须真是那几个文件。ZIP 里少一个 DLL，用户按下停止才会发现。
      - name: 校验产物内容
        shell: pwsh
        run: ./scripts/verify-windows-package.ps1

  # 确认打包配置没坏。只在 CI 上验证能产出包，不上传——上传是 release 的事。
  package:
    name: Linux 打包冒烟
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 rust-toolchain.toml 钉住的工具链
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm

      - run: cargo build --release --bin interview-studio
      - run: cargo deb -p is-app --no-build
      - run: cargo generate-rpm -p crates/is-app
      - name: 列出产物
        run: ls -lh target/debian/*.deb target/generate-rpm/*.rpm
